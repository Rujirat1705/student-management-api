services:
  # 1. Backend RESTful API (Django)
  - type: web
    name: student-management-api
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"

  # 2. Frontend Web Application (HTML / JS / CSS)
  - type: static
    name: student-management-frontend
    rootDir: frontend
    publishDir: .
